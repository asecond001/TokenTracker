name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  # Manual release from a branch: tauri-action creates the tag at the run's commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.4.8 (must match the manifest version)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release-windows:
    needs: verify
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          expected="v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "${RELEASE_TAG}" != "$expected" ]; then
            echo "Tag ${RELEASE_TAG} does not match manifest version $expected" >&2
            exit 1
          fi
      - name: Build and Sign Windows Installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'TokenVane ${{ env.RELEASE_TAG }}'
          releaseBody: 'TokenVane desktop release with signed Windows installers and latest.json updater manifest.'
          releaseDraft: false
          prerelease: false
