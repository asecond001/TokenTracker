name: TokenTracker
options:
  bundleIdPrefix: com.tokentracker
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TokenTrackerCore:
    path: CoreFFI

settings:
  base:
    BUNDLE_BASE_ID: com.tokentracker.app
    APP_GROUP_ID: group.$(BUNDLE_BASE_ID)
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

targets:
  TokenTracker:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - TokenTracker.entitlements
      - path: Shared
    info:
      path: App/Info.plist
    entitlements:
      path: App/TokenTracker.entitlements
    dependencies:
      - package: TokenTrackerCore
        product: TokenTrackerCore
      - target: TokenTrackerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID)
        PRODUCT_NAME: TokenTracker
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TokenTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_LIVE_ACTIVITIES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual

  TokenTrackerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - TokenTrackerWidgets.entitlements
      - path: Shared
    info:
      path: Widgets/Info.plist
    entitlements:
      path: Widgets/TokenTrackerWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).widgets
        PRODUCT_NAME: TokenTrackerWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/TokenTrackerWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual

  TokenTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        excludes:
          - Info.plist
    info:
      path: Tests/Info.plist
    dependencies:
      - target: TokenTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).tests
        INFOPLIST_FILE: Tests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TokenTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TokenTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TokenTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
        excludes:
          - Info.plist
    info:
      path: UITests/Info.plist
    dependencies:
      - target: TokenTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).uitests
        INFOPLIST_FILE: UITests/Info.plist
        TEST_TARGET_NAME: TokenTracker

schemes:
  TokenTracker:
    shared: true
    build:
      targets:
        TokenTracker: all
        TokenTrackerWidgets: all
        TokenTrackerTests: [test]
        TokenTrackerUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: TokenTrackerTests
          parallelizable: false
        - name: TokenTrackerUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
