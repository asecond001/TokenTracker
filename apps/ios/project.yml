name: TokenVane
options:
  bundleIdPrefix: com.asecond
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TokenVaneCore:
    path: CoreFFI

settings:
  base:
    BUNDLE_BASE_ID: com.asecond.tokenvane
    APP_GROUP_ID: group.$(BUNDLE_BASE_ID)
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

targets:
  TokenVane:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - TokenVane.entitlements
      - path: Shared
      - path: Widgets/RefreshWidgetIntent.swift
    dependencies:
      - package: TokenVaneCore
        product: TokenVaneCore
      - target: TokenVaneWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID)
        PRODUCT_NAME: TokenVane
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TokenVane.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_LIVE_ACTIVITIES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(TT_APP_PROFILE)

  TokenVaneWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - TokenVaneWidgets.entitlements
      - path: Shared
      - path: App/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).widgets
        PRODUCT_NAME: TokenVaneWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/TokenVaneWidgets.entitlements
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": $(TT_WIDGETS_PROFILE)

  TokenVaneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        excludes:
          - Info.plist
    dependencies:
      - target: TokenVane
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).tests
        INFOPLIST_FILE: Tests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TokenVane.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TokenVane"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TokenVaneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
        excludes:
          - Info.plist
    dependencies:
      - target: TokenVane
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE_ID).uitests
        INFOPLIST_FILE: UITests/Info.plist
        TEST_TARGET_NAME: TokenVane

schemes:
  TokenVane:
    shared: true
    build:
      targets:
        TokenVane: all
        TokenVaneWidgets: all
        TokenVaneTests: [test]
        TokenVaneUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: TokenVaneTests
          parallelizable: false
        - name: TokenVaneUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
